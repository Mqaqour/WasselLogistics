# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - wasselps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          # Left unset intentionally: frontend and backend are served from the same
          # Express server/origin in production, so every API call site's fallback
          # to a relative URL (see e.g. Tracking.tsx, chatApi.ts) is what we want here.
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_RESPONDIO_CHANNEL_ID: ${{ secrets.VITE_RESPONDIO_CHANNEL_ID }}
          VITE_GOOGLE_PLACES_LANGUAGE: en

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Assemble unified deployment package
        run: |
          if (Test-Path deploy) { Remove-Item -Path deploy -Recurse -Force }
          New-Item -ItemType Directory -Path deploy\dist\public -Force | Out-Null
          Copy-Item backend\package.json deploy\package.json
          Copy-Item backend\package-lock.json deploy\package-lock.json
          Copy-Item backend\dist\* deploy\dist -Recurse -Force
          Copy-Item dist\* deploy\dist\public -Recurse -Force
          Set-Content -Path deploy\server.js -Value "require('./dist/server.js');"
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode" />
              </handlers>
              <rewrite>
                <rules>
                  <rule name="NodeInspector" patternSyntax="ECMAScript" stopProcessing="true">
                    <match url="^server.js\/debug[\/]?" />
                  </rule>
                  <rule name="DynamicContent">
                    <action type="Rewrite" url="server.js" />
                  </rule>
                </rules>
              </rewrite>
              <iisnode loggingEnabled="true" />
            </system.webServer>
          </configuration>
          '@ | Set-Content -Path deploy\web.config

      - name: Install production dependencies in deployment package
        run: npm ci --omit=dev --prefix deploy

      - name: Upload deployment package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy
          retention-days: 1

  deploy:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download deployment package artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package
          path: deploy

      - name: Write backend runtime env file
        env:
          _DB_PASSWORD:        ${{ secrets.DB_PASSWORD }}
          _QUICKRATE_API_KEY:  ${{ secrets.QUICKRATE_API_KEY }}
          _RESPOND_API_TOKEN:  ${{ secrets.RESPOND_API_TOKEN }}
          _AI_PROJECT_API_KEY: ${{ secrets.AI_PROJECT_API_KEY }}
          _SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
        run: |
          $lines = @(
            "DB_SERVER=wassel.database.windows.net",
            "DB_DATABASE=wasselwebdb",
            "DB_USERNAME=sqladmin",
            "DB_PASSWORD=$env:_DB_PASSWORD",
            "DB_PORT=1433",
            "DB_ENCRYPT=true",
            "DB_TRUST_SERVER_CERTIFICATE=false",
            "QUICKRATE_API_KEY=$env:_QUICKRATE_API_KEY",
            "QUICKRATE_BASE_URL=https://quickrate.wassel.ps",
            "QUICKRATE_RESULT_MODE=lowest",
            "RESPOND_CHANNEL_ID=08d7f8165160db9866145bc7dcbb031",
            "RESPOND_API_TOKEN=$env:_RESPOND_API_TOKEN",
            "RESPOND_WEBHOOK_URL=https://app.respond.io/custom/channel/webhook/",
            "AI_PROVIDER=azure",
            "AI_PROJECT_ENDPOINT=https://wasselaifoundry.services.ai.azure.com/api/projects/Wassel-default",
            "AI_PROJECT_API_KEY=$env:_AI_PROJECT_API_KEY",
            "AI_AGENT_NAME=WSLAIV52",
            "AI_AGENT_VERSION=4",
            "FRONTEND_URL=https://wasselwebprod.wassel.ps,https://wasselps-wasselwebprod.azurewebsites.net",
            "NODE_ENV=production",
            "SMTP_HOST=smtp.mandrillapp.com",
            "SMTP_PORT=587",
            "SMTP_USER=automate@wassel.ps",
            "SMTP_PASSWORD=$env:_SMTP_PASSWORD",
            "PICKUP_NOTIFY_EMAIL=Mqaqour@wassel.ps"
          )
          $lines | Set-Content -Path deploy\.env

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'wasselps'
          slot-name: 'wasselwebprod'
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_EF74C1D716BB45AD8558CBD3F7A0AB41 }}
