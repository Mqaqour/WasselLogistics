# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - wasselps

on:
  push:
    branches:
      - questions
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_CHAT_BACKEND_URL: ${{ secrets.VITE_CHAT_BACKEND_URL }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_RESPONDIO_CHANNEL_ID: ${{ secrets.VITE_RESPONDIO_CHANNEL_ID }}
          VITE_GOOGLE_PLACES_LANGUAGE: en

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Assemble unified deployment package
        run: |
          if (Test-Path deploy) { Remove-Item -Path deploy -Recurse -Force }
          New-Item -ItemType Directory -Path deploy\dist\public -Force | Out-Null
          Copy-Item backend\package.json deploy\package.json
          Copy-Item backend\package-lock.json deploy\package-lock.json
          Copy-Item backend\dist\* deploy\dist -Recurse -Force
          Copy-Item dist\* deploy\dist\public -Recurse -Force
          Set-Content -Path deploy\server.js -Value "require('./dist/server.js');"
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode" />
              </handlers>
              <rewrite>
                <rules>
                  <rule name="NodeInspector" patternSyntax="ECMAScript" stopProcessing="true">
                    <match url="^server.js\/debug[\/]?" />
                  </rule>
                  <rule name="DynamicContent">
                    <action type="Rewrite" url="server.js" />
                  </rule>
                </rules>
              </rewrite>
              <iisnode loggingEnabled="true" />
            </system.webServer>
          </configuration>
          '@ | Set-Content -Path deploy\web.config

      - name: Install production dependencies in deployment package
        run: npm ci --omit=dev --prefix deploy
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'wasselps'
          slot-name: 'wasselwebdbuat'
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_EF74C1D716BB45AD8558CBD3F7A0AB41 }}