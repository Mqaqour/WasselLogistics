# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - wasselps

on:
  push:
    branches:
      - questions
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_CHAT_BACKEND_URL: ${{ secrets.VITE_CHAT_BACKEND_URL }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_RESPONDIO_CHANNEL_ID: ${{ secrets.VITE_RESPONDIO_CHANNEL_ID }}
          VITE_GOOGLE_PLACES_LANGUAGE: en

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Assemble unified deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy/dist/public
          cp backend/package.json deploy/package.json
          cp backend/package-lock.json deploy/package-lock.json
          cp -R backend/dist/* deploy/dist/
          cp -R dist/* deploy/dist/public/
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'wasselps'
          slot-name: 'wasselwebdbuat'
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_EF74C1D716BB45AD8558CBD3F7A0AB41 }}